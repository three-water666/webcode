<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6ff"/>
      <stop offset="60%" stop-color="#e8f6ff"/>
      <stop offset="100%" stop-color="#fdfefe"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d8a0"/>
      <stop offset="100%" stop-color="#7cbf7a"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f4f7fa"/>
      <stop offset="100%" stop-color="#dde4ec"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#f9b23c"/>
      <stop offset="100%" stop-color="#f7a417"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffd684"/>
      <stop offset="100%" stop-color="#f5b845"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="46" fill="#ffe066" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.8">
    <ellipse cx="140" cy="110" rx="52" ry="26"/>
    <ellipse cx="185" cy="122" rx="38" ry="20"/>
    <ellipse cx="96" cy="126" rx="34" ry="18"/>
    <ellipse cx="620" cy="180" rx="44" ry="20"/>
    <ellipse cx="662" cy="190" rx="30" ry="15"/>
  </g>

  <!-- ground -->
  <path d="M0 512 H800 V600 H0 Z" fill="url(#ground)"/>
  <path d="M0 512 H800" stroke="#6fb26d" stroke-width="4"/>
  <ellipse cx="400" cy="516" rx="330" ry="22" fill="url(#shadow)"/>

  <!-- ================= BICYCLE ================= -->
  <g id="bicycle">
    <!-- rear wheel -->
    <g>
      <circle cx="250" cy="420" r="90" fill="none" stroke="#2b2b33" stroke-width="11"/>
      <circle cx="250" cy="420" r="80" fill="none" stroke="#c3ccd6" stroke-width="5"/>
      <g stroke="#cfd6dd" stroke-width="2">
        <line x1="250" y1="420" x2="330" y2="420"/>
        <line x1="250" y1="420" x2="319.3" y2="460"/>
        <line x1="250" y1="420" x2="290" y2="489.3"/>
        <line x1="250" y1="420" x2="250" y2="500"/>
        <line x1="250" y1="420" x2="210" y2="489.3"/>
        <line x1="250" y1="420" x2="180.7" y2="460"/>
        <line x1="250" y1="420" x2="170" y2="420"/>
        <line x1="250" y1="420" x2="180.7" y2="380"/>
        <line x1="250" y1="420" x2="210" y2="350.7"/>
        <line x1="250" y1="420" x2="250" y2="340"/>
        <line x1="250" y1="420" x2="290" y2="350.7"/>
        <line x1="250" y1="420" x2="319.3" y2="380"/>
      </g>
      <circle cx="250" cy="420" r="9" fill="#8b95a1"/>
    </g>

    <!-- front wheel -->
    <g>
      <circle cx="550" cy="420" r="90" fill="none" stroke="#2b2b33" stroke-width="11"/>
      <circle cx="550" cy="420" r="80" fill="none" stroke="#c3ccd6" stroke-width="5"/>
      <g stroke="#cfd6dd" stroke-width="2">
        <line x1="550" y1="420" x2="630" y2="420"/>
        <line x1="550" y1="420" x2="619.3" y2="460"/>
        <line x1="550" y1="420" x2="590" y2="489.3"/>
        <line x1="550" y1="420" x2="550" y2="500"/>
        <line x1="550" y1="420" x2="510" y2="489.3"/>
        <line x1="550" y1="420" x2="480.7" y2="460"/>
        <line x1="550" y1="420" x2="470" y2="420"/>
        <line x1="550" y1="420" x2="480.7" y2="380"/>
        <line x1="550" y1="420" x2="510" y2="350.7"/>
        <line x1="550" y1="420" x2="550" y2="340"/>
        <line x1="550" y1="420" x2="590" y2="350.7"/>
        <line x1="550" y1="420" x2="619.3" y2="380"/>
      </g>
      <circle cx="550" cy="420" r="9" fill="#8b95a1"/>
    </g>

    <!-- chain -->
    <line x1="368" y1="415" x2="252" y2="412" stroke="#5a6470" stroke-width="4" stroke-dasharray="5 3"/>
    <line x1="368" y1="457" x2="252" y2="430" stroke="#5a6470" stroke-width="4" stroke-dasharray="5 3"/>

    <!-- frame -->
    <g stroke="#d94f3d" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="370" y1="435" x2="305" y2="288"/>
      <line x1="370" y1="435" x2="543" y2="322"/>
      <line x1="305" y1="288" x2="528" y2="288"/>
      <line x1="370" y1="435" x2="250" y2="420"/>
      <line x1="305" y1="288" x2="250" y2="420"/>
      <line x1="543" y1="322" x2="550" y2="420"/>
      <line x1="528" y1="288" x2="543" y2="322"/>
    </g>

    <!-- handlebar stem + bar -->
    <line x1="528" y1="288" x2="520" y2="258" stroke="#b8402f" stroke-width="9" stroke-linecap="round"/>
    <path d="M468 262 Q520 238 572 262" fill="none" stroke="#d94f3d" stroke-width="9" stroke-linecap="round"/>
    <line x1="468" y1="262" x2="452" y2="268" stroke="#2b2b33" stroke-width="12" stroke-linecap="round"/>
    <line x1="572" y1="262" x2="588" y2="268" stroke="#2b2b33" stroke-width="12" stroke-linecap="round"/>

    <!-- seat post + saddle -->
    <line x1="305" y1="288" x2="298" y2="262" stroke="#b8402f" stroke-width="8" stroke-linecap="round"/>
    <path d="M255 258 Q298 240 340 258 Q310 272 255 258 Z" fill="#3b3f47"/>

    <!-- crank + pedals -->
    <circle cx="370" cy="435" r="24" fill="none" stroke="#8b95a1" stroke-width="5"/>
    <circle cx="370" cy="435" r="7" fill="#5a6470"/>
    <line x1="370" y1="435" x2="370" y2="478" stroke="#5a6470" stroke-width="8" stroke-linecap="round"/>
    <rect x="348" y="474" width="44" height="10" rx="4" fill="#2b2b33"/>
    <line x1="370" y1="435" x2="370" y2="392" stroke="#5a6470" stroke-width="8" stroke-linecap="round"/>
    <rect x="348" y="386" width="44" height="10" rx="4" fill="#2b2b33"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <g id="pelican">
    <!-- legs -->
    <g stroke="#f0992f" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M322 272 L352 352 L372 470"/>
      <path d="M300 276 L318 350 L352 392"/>
    </g>
    <path d="M348 468 L400 478 L370 492 Z" fill="#f0992f"/>
    <path d="M330 388 L374 398 L344 412 Z" fill="#f0992f"/>

    <!-- tail -->
    <path d="M258 240 Q214 244 196 272 Q236 276 264 264 Z" fill="#e7edf3" stroke="#cfd8e2" stroke-width="3"/>

    <!-- body -->
    <ellipse cx="312" cy="240" rx="66" ry="50" fill="url(#bodyGrad)" stroke="#cfd8e2" stroke-width="3" transform="rotate(-12 312 240)"/>

    <!-- neck -->
    <path d="M352 218 Q400 200 430 166" fill="none" stroke="#f7fafc" stroke-width="40" stroke-linecap="round"/>
    <path d="M352 218 Q400 200 430 166" fill="none" stroke="#cfd8e2" stroke-width="40" stroke-linecap="round" opacity="0.25"/>
    <path d="M356 214 Q402 198 430 166" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="438" cy="140" r="31" fill="url(#bodyGrad)" stroke="#cfd8e2" stroke-width="3"/>

    <!-- beak: upper mandible -->
    <path d="M458 118 Q540 126 606 156 Q602 166 596 168 Q532 148 458 143 Z" fill="url(#beakGrad)" stroke="#dd8f22" stroke-width="2.5"/>
    <!-- pouch -->
    <path d="M458 143 Q530 150 596 168 Q572 232 512 226 Q466 218 458 150 Z" fill="url(#pouchGrad)" stroke="#dd8f22" stroke-width="2.5"/>
    <path d="M470 160 Q520 190 586 172" fill="none" stroke="#f0ab3f" stroke-width="2" opacity="0.8"/>

    <!-- eye -->
    <circle cx="450" cy="130" r="6.5" fill="#25303b"/>
    <circle cx="452" cy="128" r="2.2" fill="#ffffff"/>

    <!-- wing -->
    <path d="M330 212 Q420 206 508 246 Q462 272 396 264 Q344 256 324 232 Z" fill="#fbfdfe" stroke="#c8d3de" stroke-width="3"/>
    <g stroke="#c8d3de" stroke-width="2.5" fill="none" opacity="0.9">
      <path d="M352 226 Q412 236 470 250"/>
      <path d="M348 240 Q408 250 456 258"/>
    </g>
    <path d="M498 248 Q516 252 508 258 Q496 258 498 248 Z" fill="#eef3f8" stroke="#c8d3de" stroke-width="2"/>
  </g>

  <!-- motion lines -->
  <g stroke="#9fb8c9" stroke-width="5" stroke-linecap="round" opacity="0.65">
    <line x1="60" y1="330" x2="128" y2="330"/>
    <line x1="40" y1="372" x2="112" y2="372"/>
    <line x1="72" y1="414" x2="120" y2="414"/>
  </g>
</svg>
